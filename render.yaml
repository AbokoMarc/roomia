services:
  - type: web
    name: roomia
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/rooms
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur Roomia
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BINANCE_PAY_API_KEY
        sync: false
      - key: BINANCE_PAY_SECRET_KEY
        sync: false
      - key: BINANCE_PAY_CURRENCY
        value: USDT
# Base de données : Turso (SQLite hébergé, plan gratuit persistant). Voir README → section Turso
# pour créer la base et récupérer TURSO_DATABASE_URL / TURSO_AUTH_TOKEN avant le premier déploiement.
# Paiements : crypto uniquement — wallet manuel configuré dans l'admin (Paiements → Crypto) par défaut,
# automatisable via Binance Pay (facultatif) en renseignant BINANCE_PAY_API_KEY/SECRET_KEY.
