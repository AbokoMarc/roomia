services:
  - type: web
    name: roomia
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/rooms
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur Roomia
      - key: DB_PATH
        value: /app/backend/data/roomia.db
# Pas de disque persistant sur le plan gratuit : la base SQLite repart de zéro à chaque redémarrage
# (veille après inactivité). Voir README → section "Plan gratuit" avant de passer en production réelle.
